name: Bug report
description: Report a reproducible problem in Smash
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing Smash issues for duplicates.
          required: true
        - label: I removed credentials and private server information from logs and screenshots.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Smash...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Terminal
        - Agent mode
        - ChatGPT connection
        - Ollama
        - LM Studio
        - SSH
        - Project explorer
        - Editor or diff viewer
        - Settings
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Smash version or commit
      placeholder: Commit SHA or About-page version
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS version and hardware
      placeholder: macOS 15.1, Apple M3
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or additional context
      description: Attach useful evidence after removing credentials and private information.
