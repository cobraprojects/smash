name: Feature request
description: Suggest an improvement to Smash
labels: [enhancement]
body:
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing Smash issues for a similar request.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem should Smash solve?
      description: Explain the workflow or limitation, not only the desired UI.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you would like Smash to behave.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include current workarounds or related tools if applicable.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, or technical details if useful.
