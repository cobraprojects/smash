name: Smash CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smash-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WARP_SKIP_COMMON_SKILLS_INSTALL: "1"

jobs:
  check:
    name: Format and compile Smash
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Check out source and LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check Smash
        run: cargo check --locked -p warp --bin warp-oss --features gui
